# file: containerized_build.centos.ini
# date: 2026-09-17
#
# Sourced by ./scripts/containerized_build.sh. Copy this file to describe another
# target platform; only `IMAGE` usually differs.

# Required configs
CURR_DIR=$(pwd)
WORKSPACE="${CURR_DIR}/_workspace/build_in_container"
CONDA_YAML_PATH="${CURR_DIR}/environment.yaml"
REQUIREMENTS_PATH="${CURR_DIR}/requirements.txt"
BUILD_IN_CONTAINER_SCRIPT_PATH="${CURR_DIR}/scripts/build_in_container.sh"
IMAGE="centos:centos7.9.2009"

# Custom compiling options
# Space-separated cargo features, passed to `cargo build --features`. Empty means
# default features only, the equivalent of `DUMMY_COMPILE_OPTION=OFF`.
CARGO_FEATURES=""
# `release` or `dev`.
CARGO_PROFILE="release"
